<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Gradients -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="circleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="textShreeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1b36" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="#030712" />

  <!-- Outer Neon Glowing Squircle Border -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#neonBorder)" stroke-width="6" filter="url(#neonGlow)" opacity="0.95" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

  <!-- Side Equalizer Waves (Left - Pink/Purple) -->
  <g filter="url(#neonGlow)">
    <line x1="56" y1="256" x2="56" y2="280" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" />
    <line x1="70" y1="236" x2="70" y2="300" stroke="#ec4899" stroke-width="5" stroke-linecap="round" />
    <line x1="84" y1="216" x2="84" y2="320" stroke="#d946ef" stroke-width="5" stroke-linecap="round" />
    <line x1="98" y1="240" x2="98" y2="296" stroke="#c084fc" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Side Equalizer Waves (Right - Cyan/Blue) -->
  <g filter="url(#neonGlow)">
    <line x1="414" y1="240" x2="414" y2="296" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />
    <line x1="428" y1="216" x2="428" y2="320" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" />
    <line x1="442" y1="236" x2="442" y2="300" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <line x1="456" y1="256" x2="456" y2="280" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Center Avatar Circular Frame -->
  <g filter="url(#softGlow)">
    <!-- Outer Glow Circle -->
    <circle cx="256" cy="216" r="130" fill="#090d16" stroke="url(#circleRing)" stroke-width="6" />
    <circle cx="256" cy="216" r="120" fill="#05070e" stroke="#a855f7" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 6" />
  </g>

  <!-- Avatar Clip Path for Center Image -->
  <clipPath id="avatarClip">
    <circle cx="256" cy="216" r="124" />
  </clipPath>

  <g clip-path="url(#avatarClip)">
    <!-- Background inside Circle -->
    <circle cx="256" cy="216" r="124" fill="#0c0a1d" />

    <!-- Soft Backlight Radial Aura -->
    <circle cx="256" cy="190" r="90" fill="#a855f7" opacity="0.3" filter="url(#softGlow)" />

    <!-- Girl Silhouette Body / Turtleneck -->
    <path d="M 180 340 L 180 290 Q 210 270 256 270 Q 302 270 332 290 L 332 340 Z" fill="#111827" />
    <path d="M 216 280 Q 256 290 296 280 L 296 300 Q 256 310 216 300 Z" fill="#1f2937" opacity="0.8" />

    <!-- Neck & Face -->
    <path d="M 232 240 Q 256 275 280 240 L 280 280 Q 256 288 232 280 Z" fill="url(#skinGrad)" />
    <!-- Face Shape -->
    <path d="M 210 180 C 210 245 302 245 302 180 C 302 140 210 140 210 180 Z" fill="url(#skinGrad)" />

    <!-- Cute Eyes (Closed / Peaceful) -->
    <path d="M 226 182 Q 238 174 246 184" fill="none" stroke="#27132e" stroke-width="3" stroke-linecap="round" />
    <path d="M 266 184 Q 274 174 286 182" fill="none" stroke="#27132e" stroke-width="3" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <ellipse cx="228" cy="194" rx="8" ry="4" fill="#f43f5e" opacity="0.35" />
    <ellipse cx="284" cy="194" rx="8" ry="4" fill="#f43f5e" opacity="0.35" />

    <!-- Lips -->
    <path d="M 250 206 Q 256 210 262 206" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />

    <!-- Hair Bun & Strands -->
    <ellipse cx="256" cy="120" rx="36" ry="30" fill="url(#hairGrad)" />
    <path d="M 200 170 Q 220 120 256 128 Q 292 120 312 170 C 322 210 306 250 300 260 Q 292 210 292 180 C 280 150 232 150 220 180 Q 220 210 212 260 C 206 250 190 210 200 170 Z" fill="url(#hairGrad)" />
    <!-- Front Hair Bangs -->
    <path d="M 220 150 Q 240 180 252 165 Q 260 180 280 148 Q 256 130 220 150 Z" fill="#23142e" />

    <!-- Headset & Mic -->
    <circle cx="206" cy="186" r="18" fill="#111827" stroke="#c084fc" stroke-width="3" />
    <circle cx="206" cy="186" r="10" fill="#090d16" stroke="#ec4899" stroke-width="2" />
    <!-- Headset Band -->
    <path d="M 206 170 Q 256 116 306 170" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <!-- Mic Boom Arm -->
    <path d="M 212 196 Q 236 218 260 210" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="260" cy="210" r="4" fill="#f43f5e" filter="url(#softGlow)" />
  </g>

  <!-- Typography Area -->
  <g text-anchor="middle">
    <!-- Cursive / Display "Shree" Text -->
    <text x="252" y="385" font-family="'Brush Script MT', 'Dancing Script', 'Playfair Display', cursive, sans-serif" font-size="72" font-weight="900" font-style="italic" fill="url(#textShreeGrad)" filter="url(#neonGlow)" letter-spacing="1">
      Shree
    </text>

    <!-- Glowing Star Sparkle on 'ee' -->
    <path d="M 334 336 L 338 348 L 350 352 L 338 356 L 334 368 L 330 356 L 318 352 L 330 348 Z" fill="#e0e7ff" filter="url(#neonGlow)" />

    <!-- "AI ASSISTANT" Text -->
    <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f472b6" letter-spacing="7" opacity="0.95">
      AI ASSISTANT
    </text>

    <!-- Sub Accent Dots -->
    <circle cx="236" cy="442" r="3" fill="#ec4899" />
    <circle cx="256" cy="442" r="4.5" fill="#c084fc" />
    <circle cx="276" cy="442" r="3" fill="#38bdf8" />
  </g>
</svg>
